name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0-beta)'
        required: false
        default: 'v0.1.0-beta'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Binary & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "VERSION=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Build mouse-battery.exe (Pure Go Win32, Zero CGO)
        env:
          CGO_ENABLED: '0'
          GOOS: 'windows'
          GOARCH: 'amd64'
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Building MouseBatteryTray version: $VERSION"
          go build -ldflags="-H=windowsgui -s -w -X main.Version=$VERSION" -o mouse-battery.exe .

      - name: Verify Build Artifacts
        run: |
          ls -lh mouse-battery.exe devices.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: MouseBatteryTray ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'beta') || contains(steps.get_version.outputs.VERSION, 'alpha') || contains(steps.get_version.outputs.VERSION, 'rc') }}
          generate_release_notes: true
          files: |
            mouse-battery.exe
            devices.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
